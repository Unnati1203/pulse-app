services:
  - type: keyvalue
    name: pulse-redis
    plan: free
    ipAllowList: []

  - type: web
    name: pulse-api
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 4000
      - key: FRONTEND_URL
        value: https://pulse-web.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: pulse-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: pulse-redis
          property: connectionString
      - key: USE_REDIS_SESSION
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        value: https://pulse-api.onrender.com/api/auth/google/callback
      - key: ETHEREAL_HOST
        value: smtp.ethereal.email
      - key: ETHEREAL_PORT
        value: 587
      - key: ETHEREAL_USER
        sync: false
      - key: ETHEREAL_PASSWORD
        sync: false
      - key: WORKER_CONCURRENCY
        value: 5
      - key: MAX_EMAILS_PER_HOUR
        value: 100
      - key: MIN_EMAIL_DELAY_MS
        value: 2000

  - type: web
    runtime: static
    name: pulse-web
    buildCommand: npm ci && npm run build:web
    staticPublishPath: ./web/dist
    envVars:
      - key: VITE_API_URL
        value: https://pulse-api.onrender.com/api

databases:
  - name: pulse-db
    plan: free